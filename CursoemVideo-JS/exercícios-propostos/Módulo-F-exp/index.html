<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Analisador</title>
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <main>
        <section id="conteudo">
            <label for="numtxt">Número(entre 1 e 100):</label>
            <input type="number" name="num" id="numtxt">
            <input type="button" value="Adicionar" onclick="Adicionar()">
        </section>
        <section id="res">
            <select name="valor" id="resvalor" size="10"></select>
            <input type="button" value="Finalizar" onclick="Finalizar()">
        </section>
        <div id="res"></div>
    </main>

    <script src="ambiente.js"></script>
</body>
</html>
