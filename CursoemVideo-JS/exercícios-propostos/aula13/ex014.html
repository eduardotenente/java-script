<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio do Dia</title>
    <style>
        body {
            background-color: rgb(160, 160, 16);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
        }

        header h1, footer {
            color: white;
        }

        section {
            background-color: white;
            width: 300px;
            height: 200px;
            margin: auto;
            border-radius: 10px;
            font-weight: bold;
        }

        section div {
            padding-top: 10px;
        }

        section #imagem {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hora do Dia</h1>
    </header>

    <section>
        <div id="horario"></div>
        <div id="imagem"></div>
    </section>

    <footer>
        <h3>@CursoEmVideo</h2>
    </footer>

    <script>
        var agora = new Date()
        var hora = agora.getHours()
        var horario = document.querySelector('div#horario')
        var img = document.querySelector('div#imagem')
        horario.innerText = `Agora são ${hora} horas.`
        img.innerHTML = ""
    </script>
</body>
</html>
