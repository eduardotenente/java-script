<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio do Dia</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
        }

        header h1, footer {
            color: white;
        }

        section {
            background-color: white;
            width: 300px;
            height: 210px;
            margin: auto;
            border-radius: 10px;
            font-weight: bold;
        }

        section div {
            padding-top: 10px;
        }

        section #imagem > img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hora do Dia</h1>
    </header>

    <section>
        <div id="horario"></div>
        <div id="imagem"></div>
    </section>

    <footer>
        <h3>@CursoEmVideo</h2>
    </footer>

    <script>
        var corpo = document.body
        var agora = new Date()
        var hora = agora.getHours()
        var horario = document.querySelector('div#horario')
        var img = document.querySelector('div#imagem')
        horario.innerText = `Agora são ${hora} horas.`

        if (hora >= 6 && hora < 12) {
            img.innerHTML = '<img src="imagens/manha.jpg" alt="Imagem de Dia"</img>';
            corpo.style.backgroundColor = 'yellow'

        } else if (hora >= 12 && hora < 18) {
            img.innerHTML = '<img src="imagens/tarde.jpg" alt="Imagem de Dia"</img>'
            corpo.style.backgroundColor = 'brown'

        } else {
            img.innerHTML = '<img src="imagens/noite.jpg" alt="Imagem de Dia"</img>'
            corpo.style.backgroundColor = 'gray'
        }
    </script>
</body>
</html>
