<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css">
    <title>Verificação</title>
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>

    <section>
        <div id="formulario">
            <label for="ano">Ano de Nascimento: </label>
            <input type="number" name="ano" id="ano" min="1900" max="2026" required>
            <br>
            <p>
                Sexo:
                <input type="radio" name="option" id="fem"> Feminino
                <input type="radio" name="option" id="masc"> Masculino
            </p>
            <input type="button" value="Verificar" onclick="clicar()">
        </div>
        <div id="desc">
            Preencha todos os dados acima para verificar!
        </div>
        <div id="imagem">
            <!-- Imagem -->
        </div>
    </section>

    <footer><p>&copy; CursoEmVideo</p></footer>

    <script src="script/script.js"></script>
</body>
</html>
