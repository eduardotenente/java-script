<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
            background-color: rgb(130, 62, 194);
            color: white;
        }

        section {
            background-color: hotpink;
            width: 400px;
            height: 200px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.267);
        }

        #formulario {
            padding-top: 10px;
        }

        input[type=button] {
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: .5s;
            box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.267);
        }

        input[type=button]:hover {
            padding: 15px;
            transition: padding .5s;
        }

        label, p {
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.274);
        }
    </style>
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>

    <section>
        <div id="formulario">
            <label for="ano">Ano de Nascimento: </label>
            <input type="number" name="ano" id="ano" min="1900" max="2026" required>
            <br>
            <p>
                Sexo:
                <input type="radio" name="fem" id="fem"> Feminino
                <input type="radio" name="masc" id="masc"> Masculino
            </p>
            <input type="button" value="Verificar" onclick="clicar()">
        </div>
        <div id="imagem">
            Preencha todos os dados acima para verificar!
        </div>
    </section>

    <footer>@CursoEmVideo</footer>

    <script>
        function clicar() {
            var nasc = document.querySelector('input#ano')
            var num = Number(nasc.value)
            var F = document.querySelector('input#fem')
            var M = document.querySelector('input#masc')
            var res = document.querySelector('div#imagem')
            var idade = 2026 - num

            if (idade < 14 && F == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade < 14 && M == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 14 && idade < 20 && F == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 14 && idade < 20 && M == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 20 && idade < 40 && F == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 20 && idade < 40 && M == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 40 && idade < 60 && F == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 40 && idade < 60 && M == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 60 && F == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            } else if (idade >= 60 && M == true) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
            }

            if (F == false || M == false || nasc == false) {
                alert('[ERRO] Verifique os dados novamente!')
            } 
        }
    </script>
</body>
</html>
