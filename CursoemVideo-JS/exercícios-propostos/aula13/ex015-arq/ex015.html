<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
            background: black url(imagens/miku-dancing.gif) no-repeat center center fixed;
            color: white;
        }

        section {
            background-color: rgba(105, 238, 255, 0.349);
            width: 400px;
            height: 340px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.267);
        }

        #formulario {
            padding-top: 10px;
        }

        input[type=number] {
            background-color: rgba(255, 255, 255, 0.459);
            border-radius: 5px;
            border: none;
        }

        input[type=button] {
            background-color: rgba(255, 255, 255, 0.459);
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: .5s;
            box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.267);
        }

        input[type=button]:hover {
            padding: 15px;
            transition: padding .5s;
        }

        
        label, p {
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.274);
        }
        
        img {
            width: 150px;
            height: 150px;
            margin-top: 10px;
            border-radius: 50%;
            box-shadow: 1px 1px 15px rgba(0, 0, 0, 0.384);
            border: 2px solid rgba(0, 0, 0, 0.548);
            transition: .5s;
        }

        img:hover {
            width: 170px;
            height: 170px;
            transition: .5s;
        }
    </style>
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>

    <section>
        <div id="formulario">
            <label for="ano">Ano de Nascimento: </label>
            <input type="number" name="ano" id="ano" min="1900" max="2026" required>
            <br>
            <p>
                Sexo:
                <input type="radio" name="option" id="fem"> Feminino
                <input type="radio" name="option" id="masc"> Masculino
            </p>
            <input type="button" value="Verificar" onclick="clicar()">
        </div>
        <div id="desc">
            Preencha todos os dados acima para verificar!
        </div>
        <div id="imagem">
            <!-- Imagem -->
        </div>
    </section>

    <footer>@CursoEmVideo</footer>

    <script>
        function clicar() {
            var nasc = document.querySelector('input#ano')
            var num = Number(nasc.value)
            var F = document.querySelector('input#fem')
            var M = document.querySelector('input#masc')
            var res = document.querySelector('div#desc')
            var img = document.querySelector('div#imagem')
            var idade = 2026 - num

            if (F == null || M == null || idade > 90 || idade == null) {
                alert('[ERRO] Verifique os dados novamente!')
            }

            if (idade < 14 && F) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/criança-f.jfif" alt="Imagem"></img>'
            }
             if (idade < 14 && M) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/criança-m.jfif" alt="Imagem"></img>'
            }
             if (idade >= 14 && idade < 20 && F) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/14-20-f.jfif" alt="Imagem"></img>'
            } 
             if (idade >= 14 && idade < 20 && M) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/14-20-m.gif" alt="Imagem"></img>'
            } 
             if (idade >= 20 && idade < 40 && F) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/20-40-f.jfif" alt="Imagem"></img>'
            } 
             if (idade >= 20 && idade < 40 && M) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/20-40-m.jfif" alt="Imagem"></img>'
            }
             if (idade >= 40 && idade < 60 && F) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/50-60-f.jfif" alt="Imagem"></img>'
            }
             if (idade >= 40 && idade < 60 && M) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/50-60-m.jfif" alt="Imagem"></img>'
            }
             if (idade >= 60 && idade < 90 && F) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/61+---f.jfif" alt="Imagem"></img>'
            }
             if (idade >= 60 && idade < 90 && M) {
                res.innerText = `Detectamos que você possui ${idade} anos.`
                img.innerHTML = '<img src="imagens/61-masc.jfif" alt="Imagem"></img>'
            }
        }
    </script>
</body>
</html>
