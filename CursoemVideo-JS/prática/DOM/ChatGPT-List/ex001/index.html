<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma dos Valores</title>
    <style>
        body {
            background-color: gray;
            color: white;
        }

        input#num1, input#num2 {
            color: black;
            margin-top: 20px;
            border-radius: 5px;
        }

        #res {
            background-color: #24bb22;
            color: white;
            height: 50px;
            width: 80px;
            transition: .5s;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 3px 3px 4px 0px #0000008c;
        }

        input#res:hover {
            height: 70px;
            width: 90px;
            transition: .5s;
        }

        p, label {
            font-size: 1.2em;
            text-shadow: 1px 1px 1px black;
        }
    </style>
</head>
<body>
    <!-- Crie um programa que leia dois números digitados em campos de input e, ao clicar em um botão, exiba no DOM a soma desses dois valores. -->

    <h1>Digite dois Números</h1>

    <form action="index.js" autocomplete="off" method="POST">
        <fieldset>
            <label for="num1">Primeiro Número:</label>
            <input type="number" name="num1" id="num1">
            <br>
            <label for="num2">Segundo Número:</label>
            <input type="number" name="num2" id="num2">
            <br>
            <input type="button" value="Somar" id="res">
            <p id="resul">Resultado: </p>
        </fieldset>
    </form>

    <script src="index.js"></script>
</body>
</html>
