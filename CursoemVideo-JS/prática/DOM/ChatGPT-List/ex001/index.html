<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma dos Valores</title>
    <style>
        body {
            background-color: gray;
            color: white;
        }

        input#num1, input#num2 {
            color: black;
            margin-top: 20px;
        }

        #res {
            height: 50px;
            width: 80px;
            transition: .5s;
        }

        input#res:hover {
            height: 70px;
            width: 90px;
            transition: .5s;
        }
    </style>
</head>
<body>
    <!-- Crie um programa que leia dois números digitados em campos de input e, ao clicar em um botão, exiba no DOM a soma desses dois valores. -->

    <h1>Digite dois Números</h1>

    <form action="index.js" autocomplete="off" method="POST">
        <fieldset>
            <label for="num1">Primeiro Número:</label>
            <input type="number" name="num1" id="num1">
            <br>
            <label for="num2">Segundo Número:</label>
            <input type="number" name="num2" id="num2">
            <br>
            <input type="button" value="Somar" id="res">
        </fieldset>
    </form>

    <script src="index.js"></script>
</body>
</html>
