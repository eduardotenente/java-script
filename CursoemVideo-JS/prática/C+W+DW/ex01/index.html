<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Correta</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: darkgrey;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        div#res {
            margin-top: 40px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>Qual é a senha?</h1>
    <input type="number" name="senha" id="senha">
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"></div>

    <script>
        function verificar() {
            var res = document.querySelector('div#res')
            var senha = document.querySelector('input#senha')
            var senhacorreta = 1234

            while (Number(senha.value) != senhacorreta) {
                alert('Senha Incorreta! Tente novamente.')
            }
            res.innerHTML = 'Acesso Permitido!'
        }
    </script>
</body>
</html>
