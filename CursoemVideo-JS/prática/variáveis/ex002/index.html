<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática 2</title>
    <style>
        body {
            background-color: gray;
            color: white;
            font: normal 1.3em Arial;
        }

        h1 {
            font-size: 2em;
        }
    </style>
</head>
<body>
    <h1>Nos forneça algumas informações!</h1>
    <br>
    <script>
        var nome = prompt('Qual é o seu nome?')
        var idade = Number.parseInt(prompt('Qual é a sua idade?'))
        var sx = prompt('Qual é o seu sexo?')
        document.write(`Olá, ${nome}, bem-vindo ao nosso programa. Sua idade é de ${idade} anos, sendo do sexo ${sx}. `)
    </script>
</body>
</html>
