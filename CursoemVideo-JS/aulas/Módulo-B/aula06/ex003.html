<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Script</title>
    <style>
        body {
            background-color: rgb(71, 145, 145);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição rs</p>

    <script>
       var N1 = Number(prompt('Digite um número: ')) // string
       var N2 = Number(prompt('Digite outro número: ')) // string
       var S = N1 + N2
       window.alert('A Soma entre ${N1} e ${N2} é igual a ${S}') // Concatenação

       // (numer + number) para adição
       // (string + string) para concatenação
    </script>
</body>
</html>
