<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar CEP !</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="buscarCEP.js" defer></script>
</head>
<body>
    <header>
        <h1>Digite seu CEP e pesquise !</h1>
    </header>

    <main>
        <form id="formularioCEP">
            <label for="cep">CEP: 
                <input type="text" name="cep" id="cep">
            </label>
            <input type="submit" value="Pesquisar">
        </form>

        <section>
            <p id="estado"></p>
            <p id="cidade"></p>
            <p id="bairro"></p>
            <p id="endereço"></p>
            <span id="situação"></span>
        </section>
    </main>
</body>
</html>
