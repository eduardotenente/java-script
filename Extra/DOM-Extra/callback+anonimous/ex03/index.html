<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Callback</title>
    <script defer src="js/contador_callback.js"></script>
    <style>
        body {
            background-color: rgb(43, 41, 41);
            color: white;
            font-family: sans-serif;
        }

        button {
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 250px;
            height: 80px;
            border-radius: 10px;
            border: 2px solid white;
            font-size: 1.4em;
            font-weight: bold;
            background-color: rgb(8, 8, 8);
            color: white;
            cursor: pointer;
        }

        section {
            margin-top: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <button id="btn">Clicar para contar</button>
    <section>
        <p id="resultCalc">A contagem começará aqui</p>
    </section>

</html>
