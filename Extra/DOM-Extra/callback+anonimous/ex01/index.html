<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="js/callback.js"></script>
    <title>Callback DOM</title>
    <style>
        body {
            background: rgb(37, 37, 37);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 80px;
            border-radius: 10px;
            border: 2px solid white;
            font-size: 1.4em;
            font-weight: bold;
            background-color: rgb(8, 8, 8);
            color: white;
            cursor: pointer;
        }

        div {
            margin-top: 10%;
        }

        p {
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: 700ms;
        }
    </style>
</head>
<body>
    <button id="btn">Clique em mim</button>
    <div>
        <p id="resultMessage">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quae assumenda adipisci dolores rem laborum aliquid excepturi. Amet quasi pariatur, magni est ab iusto sunt quod perferendis vel provident. Eaque, facere!</p>
    </div>
</body>
</html>
